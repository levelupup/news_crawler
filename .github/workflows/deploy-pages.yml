name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 2026-08-07: was `false`, which cost 9 hours of stale site. Run 1578 wedged in GitHub's
  # pending-deployment state (no reviewer, wait_timer 0, current_user_can_approve false — it
  # could not be approved, only cancelled) and held this group for 15.5h. With `false` only the
  # RUNNING job is protected: each new push became the sole pending run and evicted the previous
  # pending one, so 11 consecutive runs were cancelled and the site stayed on run 1577's deploy.
  # Nothing alarmed — pushes all succeeded. With `true`, a wedged run is cancelled by the next
  # 30-min push and the site self-heals within one cycle.
  # Tradeoff accepted: a genuinely in-flight deploy can be cut short, which is harmless here —
  # today.html is fully regenerated every 30 minutes, so the next run publishes newer content.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # GitHub Pages' backend intermittently returns "Deployment failed, try
      # again later." (~25% of runs, never two in a row). Retry once after a
      # short pause instead of emitting a spurious failure — the next 30-min
      # push would redeploy anyway, but the retry clears the red X now.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
